version: '3.8'

services:
  streamrip-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamrip-web
    ports:
      - "8000:8000"
    volumes:
      # Mount streamrip config directory
      - ./config:/app/config
      # Mount downloads directory
      - ./downloads:/app/downloads
      # Mount logs directory
      - ./logs:/app/logs
      # Optional: Mount existing streamrip config
      - ~/.config/streamrip:/home/app/.config/streamrip:ro
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false
      
      # CORS Configuration
      - CORS_ORIGINS=["http://localhost:8000", "http://127.0.0.1:8000"]
      
      # WebSocket Configuration
      - WS_HEARTBEAT_INTERVAL=30
      - WS_MAX_QUEUE_SIZE=1000
      
      # Streamrip Configuration
      - STREAMRIP_CONFIG_PATH=/app/config/config.toml
      
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: streamrip-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - streamrip-web
    restart: unless-stopped
    profiles:
      - production

  # Optional: Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: streamrip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:

networks:
  default:
    name: streamrip-network
